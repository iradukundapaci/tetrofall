name: tetrofall
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  flame: ^1.18.0
  flame_audio: ^2.10.0
  shared_preferences: ^2.2.3
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/icons/
    - assets/images/blocks/
    - assets/images/textures/
    - assets/audio/sfx/
    # Registered ahead of the loops themselves — see the README in there.
    - assets/audio/music/
  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo_2/static/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo_2/static/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo_2/static/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo_2/static/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/static/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito/static/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito/static/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito/static/Nunito-ExtraBold.ttf
          weight: 800
