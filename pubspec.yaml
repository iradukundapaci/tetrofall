name: tetrofall
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.4+6

environment:
  sdk: ^3.11.5


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  flutter_svg: ^2.0.10
  flame: ^1.18.0
  flame_audio: ^2.10.0
  shared_preferences: ^2.2.3
  google_mobile_ads: ^9.0.0
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  gameanalytics_sdk: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  fake_async: ^1.3.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "branding/icon_master.png"
  adaptive_icon_background: "branding/icon_background.png"
  adaptive_icon_foreground: "branding/icon_foreground.png"
  adaptive_icon_monochrome: "branding/icon_monochrome.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#2B1C12"
  image: branding/splash_logo_legacy.png
  android_12:
    color: "#2B1C12"
    image: branding/splash_logo.png
    icon_background_color: "#2B1C12"
  android: true
  ios: true
  web: false
  android_gravity: center
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/icons/
    - assets/images/blocks/
    - assets/images/textures/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/fonts/Nunito/OFL.txt
    - assets/fonts/Baloo_2/OFL.txt
  fonts:
    - family: Baloo 2
      fonts:
        - asset: assets/fonts/Baloo_2/static/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo_2/static/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo_2/static/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo_2/static/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/static/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito/static/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito/static/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito/static/Nunito-ExtraBold.ttf
          weight: 800
