<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetrofall — Achievements</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .ac-stage {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: var(--space-lg) var(--space-lg) var(--space-xl);
      box-sizing: border-box;
      gap: var(--space-lg);
    }

    .ac-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ac-title {
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--color-text);
      margin: 0;
    }

    .ac-summary-pill .pill-icon svg {
      width: 16px;
      height: 16px;
    }

    /* ---------- Achievement rows ---------- */
    .ac-list {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .ach-row {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      border-radius: var(--radius-lg);
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      box-shadow: var(--shadow-soft);
    }

    .ach-row.is-claimable {
      border-color: var(--color-gold);
      box-shadow: 0 0 0 2px var(--color-gold), var(--shadow-soft);
    }

    .ach-icon {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ach-icon svg {
      width: 100%;
      height: 100%;
    }

    .ach-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ach-title {
      font-size: var(--font-size-sm);
      font-weight: 700;
      color: var(--color-text);
    }

    .ach-row.is-claimed .ach-title,
    .ach-row.is-claimable .ach-title {
      color: var(--color-text);
    }

    .ach-progress {
      width: 100%;
      height: 8px;
      border-radius: var(--radius-pill);
      background: rgba(0, 0, 0, 0.35);
      box-shadow: var(--shadow-inset);
      overflow: hidden;
    }

    .ach-progress-fill {
      height: 100%;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, var(--color-gold), #ffd873);
    }

    /* ---------- Right-side reward indicator ---------- */
    .ach-right {
      flex: 0 0 auto;
      text-align: right;
    }

    .ach-fraction {
      font-size: var(--font-size-xs);
      font-weight: 700;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    .ach-claim-btn {
      padding: 8px 16px;
      font-size: var(--font-size-sm);
      text-decoration: none;
      white-space: nowrap;
      animation: claimPulse 1.8s ease-in-out infinite;
    }

    @keyframes claimPulse {
      0%, 100% { box-shadow: 0 0 0 rgba(242, 182, 50, 0); }
      50%      { box-shadow: 0 0 12px rgba(242, 182, 50, 0.6); }
    }

    .ach-claimed {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--font-size-xs);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-gold);
      white-space: nowrap;
    }

    .ach-claimed svg {
      width: 13px;
      height: 13px;
    }

    /* ---------- Persistent bottom nav (same as other screens) ---------- */
    .menu-icon-row {
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-lg) var(--space-lg);
      background: rgba(20, 12, 6, 0.92);
      border-top: 1px solid var(--color-panel-border);
      box-sizing: border-box;
    }

    .menu-icon-btn {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .menu-icon-btn a.btn-icon {
      text-decoration: none;
    }

    .menu-icon-btn .btn-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-icon-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--color-text-muted);
      letter-spacing: 0.02em;
      text-align: center;
    }

    .menu-icon-btn.is-active .btn-icon {
      background: rgba(242, 182, 50, 0.18);
      border-color: var(--color-gold);
      color: var(--color-gold);
    }

    .menu-icon-btn.is-active .menu-icon-label {
      color: var(--color-gold);
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-toggle">
      <button type="button" class="is-active" data-size="mobile">Mobile</button>
      <button type="button" data-size="tablet">Tablet</button>
    </div>
    <div class="device-frame" id="frame">
      <div class="device-frame__screen bg-wood-grain">
        <div class="ac-stage">

          <div class="ac-header">
            <h1 class="ac-title">Achievements</h1>
            <div class="pill-counter ac-summary-pill">
              <span class="pill-icon">
                <svg viewBox="0 0 24 24" fill="var(--color-gold)"><path d="M8 3l2 6-3 2-3-6z" fill="var(--color-red)"/><path d="M16 3l-2 6 3 2 3-6z" fill="var(--color-red)"/><circle cx="12" cy="15" r="6"/><circle cx="12" cy="15" r="3" fill="#8a5a12"/></svg>
              </span>
              <span>1 / 5</span>
            </div>
          </div>

          <div class="ac-list">

            <!-- Destroy 1000 blocks - claimed -->
            <div class="ach-row is-claimed">
              <span class="ach-icon">
                <svg viewBox="0 0 24 24"><path d="M8 3l2 6-3 2-3-6z" fill="var(--color-red)"/><path d="M16 3l-2 6 3 2 3-6z" fill="var(--color-red)"/><circle cx="12" cy="15" r="6" fill="var(--color-gold)"/><circle cx="12" cy="15" r="3" fill="#8a5a12"/></svg>
              </span>
              <span class="ach-body">
                <span class="ach-title">Destroy 1,000 blocks</span>
                <span class="ach-progress"><span class="ach-progress-fill" style="width: 100%;"></span></span>
              </span>
              <span class="ach-right">
                <span class="ach-claimed">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-gold)"/><path d="M8 12.5l2.5 2.5L16 9" stroke="#3a2410" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Claimed
                </span>
              </span>
            </div>

            <!-- Reach 10,000 points - claimable -->
            <div class="ach-row is-claimable">
              <span class="ach-icon">
                <svg viewBox="0 0 24 24"><path d="M8 3l2 6-3 2-3-6z" fill="var(--color-red)"/><path d="M16 3l-2 6 3 2 3-6z" fill="var(--color-red)"/><circle cx="12" cy="15" r="6" fill="var(--color-gold)"/><circle cx="12" cy="15" r="3" fill="#8a5a12"/></svg>
              </span>
              <span class="ach-body">
                <span class="ach-title">Reach 10,000 points</span>
                <span class="ach-progress"><span class="ach-progress-fill" style="width: 100%;"></span></span>
              </span>
              <span class="ach-right">
                <a href="#" class="btn-primary ach-claim-btn">Claim</a>
              </span>
            </div>

            <!-- Destroy 5000 blocks - in progress -->
            <div class="ach-row">
              <span class="ach-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l2 6-3 2-3-6z"/><path d="M16 3l-2 6 3 2 3-6z"/><circle cx="12" cy="15" r="6"/></svg>
              </span>
              <span class="ach-body">
                <span class="ach-title">Destroy 5,000 blocks</span>
                <span class="ach-progress"><span class="ach-progress-fill" style="width: 65%;"></span></span>
              </span>
              <span class="ach-right">
                <span class="ach-fraction">3,240 / 5,000</span>
              </span>
            </div>

            <!-- Create a 50 combo - in progress -->
            <div class="ach-row">
              <span class="ach-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l2 6-3 2-3-6z"/><path d="M16 3l-2 6 3 2 3-6z"/><circle cx="12" cy="15" r="6"/></svg>
              </span>
              <span class="ach-body">
                <span class="ach-title">Create a 50 combo</span>
                <span class="ach-progress"><span class="ach-progress-fill" style="width: 36%;"></span></span>
              </span>
              <span class="ach-right">
                <span class="ach-fraction">18 / 50</span>
              </span>
            </div>

            <!-- Unlock all themes - in progress -->
            <div class="ach-row">
              <span class="ach-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l2 6-3 2-3-6z"/><path d="M16 3l-2 6 3 2 3-6z"/><circle cx="12" cy="15" r="6"/></svg>
              </span>
              <span class="ach-body">
                <span class="ach-title">Unlock all themes</span>
                <span class="ach-progress"><span class="ach-progress-fill" style="width: 11%;"></span></span>
              </span>
              <span class="ach-right">
                <span class="ach-fraction">1 / 9</span>
              </span>
            </div>

          </div>

        </div>

        <!-- Persistent bottom nav — same markup as other screens -->
        <div class="menu-icon-row">
          <div class="menu-icon-btn">
            <a href="daily-reward.html" class="btn-icon" aria-label="Daily Reward">
              <svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M4 9h16"/><path d="M12 9v11"/><path d="M12 9c-1.5-4-6-4-6-1.2C6 9 9 9 12 9z"/><path d="M12 9c1.5-4 6-4 6-1.2C18 9 15 9 12 9z"/></svg>
              <span class="badge">1</span>
            </a>
            <span class="menu-icon-label">Daily</span>
          </div>

          <div class="menu-icon-btn">
            <a href="themes.html" class="btn-icon" aria-label="Themes">
              <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1.5a2.5 2.5 0 0 0 2.5-2.5c0-.7-.3-1.3-.7-1.8-.4-.4-.6-1-.6-1.6a2 2 0 0 1 2-2H18a3 3 0 0 0 3-3c0-4.4-4-6.1-9-6.1z"/><circle cx="7.5" cy="10.5" r="1.1"/><circle cx="9.5" cy="7" r="1.1"/><circle cx="14" cy="6.8" r="1.1"/><circle cx="16.5" cy="9.5" r="1.1"/></svg>
            </a>
            <span class="menu-icon-label">Themes</span>
          </div>

          <div class="menu-icon-btn is-active">
            <a href="achievements.html" class="btn-icon" aria-label="Achievements">
              <svg viewBox="0 0 24 24"><path d="M8 3l2 6-3 2-3-6z"/><path d="M16 3l-2 6 3 2 3-6z"/><circle cx="12" cy="15" r="6"/><circle cx="12" cy="15" r="2.5"/></svg>
            </a>
            <span class="menu-icon-label">Awards</span>
          </div>

          <div class="menu-icon-btn">
            <a href="settings.html" class="btn-icon" aria-label="Settings">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10c.1.7.6 1.3 1.5 1.5H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </a>
            <span class="menu-icon-label">Settings</span>
          </div>

          <div class="menu-icon-btn">
            <a href="shop.html" class="btn-icon" aria-label="Shop">
              <svg viewBox="0 0 24 24"><path d="M6 9h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 9z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg>
            </a>
            <span class="menu-icon-label">Shop</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var buttons = document.querySelectorAll('.device-toggle button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        frame.classList.toggle('is-tablet', btn.dataset.size === 'tablet');
      });
    });
  </script>
</body>
</html>
