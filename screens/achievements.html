<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetrofall — Achievements</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .ac-stage {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: var(--space-lg) var(--space-lg) var(--space-xl);
      box-sizing: border-box;
      gap: var(--space-lg);
    }

    .ac-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ac-title {
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--color-text);
      margin: 0;
    }

    .ac-summary-pill .pill-icon svg {
      width: 16px;
      height: 16px;
    }

    /* ---------- Achievement rows ---------- */
    .ac-list {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .ach-row {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      border-radius: var(--radius-lg);
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      box-shadow: var(--shadow-soft);
    }

    .ach-row.is-claimable {
      border-color: var(--color-gold);
      box-shadow: 0 0 0 2px var(--color-gold), var(--shadow-soft);
    }

    .ach-icon {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ach-icon svg {
      width: 100%;
      height: 100%;
    }

    .ach-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ach-title {
      font-size: var(--font-size-sm);
      font-weight: 700;
      color: var(--color-text);
    }

    .ach-row.is-claimed .ach-title,
    .ach-row.is-claimable .ach-title {
      color: var(--color-text);
    }

    .ach-progress {
      width: 100%;
      height: 8px;
      border-radius: var(--radius-pill);
      background: rgba(0, 0, 0, 0.35);
      box-shadow: var(--shadow-inset);
      overflow: hidden;
    }

    .ach-progress-fill {
      height: 100%;
      border-radius: var(--radius-pill);
      background: linear-gradient(90deg, var(--color-gold), #ffd873);
    }

    /* ---------- Right-side reward indicator ---------- */
    .ach-right {
      flex: 0 0 auto;
      text-align: right;
    }

    .ach-fraction {
      font-size: var(--font-size-xs);
      font-weight: 700;
      color: var(--color-text-muted);
      white-space: nowrap;
    }

    .ach-claim-btn {
      padding: 8px 16px;
      font-size: var(--font-size-sm);
      text-decoration: none;
      white-space: nowrap;
      animation: claimPulse 1.8s ease-in-out infinite;
    }

    @keyframes claimPulse {
      0%, 100% { box-shadow: 0 0 0 rgba(242, 182, 50, 0); }
      50%      { box-shadow: 0 0 12px rgba(242, 182, 50, 0.6); }
    }

    .ach-claimed {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--font-size-xs);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-gold);
      white-space: nowrap;
    }

    .ach-claimed svg {
      width: 13px;
      height: 13px;
    }

  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-toggle">
      <button type="button" class="is-active" data-size="mobile">Mobile</button>
      <button type="button" data-size="tablet">Tablet</button>
    </div>
    <div class="device-frame" id="frame">
      <div class="device-frame__screen bg-wood-grain">

        <!-- Dimmed sliver of main-menu peeking above the sheet -->
        <div class="sheet-bg">
          <div class="menu-topbar-bg">
            <div class="pill-counter">
              <span class="pill-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M8 3h8v4a4 4 0 0 1-8 0V3z"/>
                  <path d="M12 9l1.2 2.4 2.6.4-1.9 1.8.4 2.5L12 15l-2.3 1.2.4-2.5-1.9-1.8 2.6-.4L12 9z"/>
                  <path d="M12 16v2"/>
                  <path d="M9 20h6"/>
                </svg>
              </span>
              <span>10,140</span>
            </div>
            <div class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10c.1.7.6 1.3 1.5 1.5H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </div>
          </div>
        </div>

        <div class="sheet-overlay">
          <div class="sheet-scrim"></div>
          <div class="bottom-sheet">
            <div class="sheet-handle-row">
              <span class="sheet-handle"></span>
            </div>

        <div class="ac-stage">

          <div class="ac-header">
            <h1 class="ac-title">Achievements</h1>
            <div class="screen-header-right">
              <div class="pill-counter ac-summary-pill">
                <span class="pill-icon">
                  <svg viewBox="0 0 24 24" fill="var(--color-gold)"><path d="M8 3l2 6-3 2-3-6z" fill="var(--color-red)"/><path d="M16 3l-2 6 3 2 3-6z" fill="var(--color-red)"/><circle cx="12" cy="15" r="6"/><circle cx="12" cy="15" r="3" fill="#8a5a12"/></svg>
                </span>
                <span>1 / 5</span>
              </div>
            </div>
          </div>

          <div class="ac-list">

            <!-- Destroy 1000 blocks - claimed -->
            <div class="ach-row is-claimed">
              <span class="ach-icon">
                <svg viewBox="0 0 24 24"><path d="M8 3l2 6-3 2-3-6z" fill="var(--color-red)"/><path d="M16 3l-2 6 3 2 3-6z" fill="var(--color-red)"/><circle cx="12" cy="15" r="6" fill="var(--color-gold)"/><circle cx="12" cy="15" r="3" fill="#8a5a12"/></svg>
              </span>
              <span class="ach-body">
                <span class="ach-title">Destroy 1,000 blocks</span>
                <span class="ach-progress"><span class="ach-progress-fill" style="width: 100%;"></span></span>
              </span>
              <span class="ach-right">
                <span class="ach-claimed">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-gold)"/><path d="M8 12.5l2.5 2.5L16 9" stroke="#3a2410" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  Claimed
                </span>
              </span>
            </div>

            <!-- Reach 10,000 points - claimable -->
            <div class="ach-row is-claimable">
              <span class="ach-icon">
                <svg viewBox="0 0 24 24"><path d="M8 3l2 6-3 2-3-6z" fill="var(--color-red)"/><path d="M16 3l-2 6 3 2 3-6z" fill="var(--color-red)"/><circle cx="12" cy="15" r="6" fill="var(--color-gold)"/><circle cx="12" cy="15" r="3" fill="#8a5a12"/></svg>
              </span>
              <span class="ach-body">
                <span class="ach-title">Reach 10,000 points</span>
                <span class="ach-progress"><span class="ach-progress-fill" style="width: 100%;"></span></span>
              </span>
              <span class="ach-right">
                <a href="#" class="btn-primary ach-claim-btn">Claim</a>
              </span>
            </div>

            <!-- Destroy 5000 blocks - in progress -->
            <div class="ach-row">
              <span class="ach-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l2 6-3 2-3-6z"/><path d="M16 3l-2 6 3 2 3-6z"/><circle cx="12" cy="15" r="6"/></svg>
              </span>
              <span class="ach-body">
                <span class="ach-title">Destroy 5,000 blocks</span>
                <span class="ach-progress"><span class="ach-progress-fill" style="width: 65%;"></span></span>
              </span>
              <span class="ach-right">
                <span class="ach-fraction">3,240 / 5,000</span>
              </span>
            </div>

            <!-- Create a 50 combo - in progress -->
            <div class="ach-row">
              <span class="ach-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l2 6-3 2-3-6z"/><path d="M16 3l-2 6 3 2 3-6z"/><circle cx="12" cy="15" r="6"/></svg>
              </span>
              <span class="ach-body">
                <span class="ach-title">Create a 50 combo</span>
                <span class="ach-progress"><span class="ach-progress-fill" style="width: 36%;"></span></span>
              </span>
              <span class="ach-right">
                <span class="ach-fraction">18 / 50</span>
              </span>
            </div>

            <!-- Unlock all themes - in progress -->
            <div class="ach-row">
              <span class="ach-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l2 6-3 2-3-6z"/><path d="M16 3l-2 6 3 2 3-6z"/><circle cx="12" cy="15" r="6"/></svg>
              </span>
              <span class="ach-body">
                <span class="ach-title">Unlock all themes</span>
                <span class="ach-progress"><span class="ach-progress-fill" style="width: 11%;"></span></span>
              </span>
              <span class="ach-right">
                <span class="ach-fraction">1 / 9</span>
              </span>
            </div>

          </div>

        </div>

            </div>
          </div>

      </div>
    </div>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var buttons = document.querySelectorAll('.device-toggle button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        frame.classList.toggle('is-tablet', btn.dataset.size === 'tablet');
      });
    });

    // Drag-to-dismiss — swipe the sheet down (or tap the dimmed scrim) to
    // close and return to the main menu, mocking the real gesture-based close.
    (function () {
      var sheet = document.querySelector('.bottom-sheet');
      var handle = document.querySelector('.sheet-handle-row');
      var scrim = document.querySelector('.sheet-scrim');
      if (!sheet || !handle) return;

      if (scrim) {
        scrim.addEventListener('click', function () {
          window.location.href = 'main-menu.html';
        });
      }

      var startY = 0;
      var dragY = 0;
      var dragging = false;

      handle.addEventListener('pointerdown', function (e) {
        dragging = true;
        startY = e.clientY;
        sheet.style.transition = 'none';
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        dragY = Math.max(0, e.clientY - startY);
        sheet.style.transform = 'translateY(' + dragY + 'px)';
      });

      function releaseDrag() {
        if (!dragging) return;
        dragging = false;
        sheet.style.transition = 'transform 0.25s ease';
        if (dragY > 120) {
          sheet.style.transform = 'translateY(100%)';
          setTimeout(function () {
            window.location.href = 'main-menu.html';
          }, 180);
        } else {
          sheet.style.transform = 'translateY(0)';
        }
        dragY = 0;
      }

      handle.addEventListener('pointerup', releaseDrag);
      handle.addEventListener('pointercancel', releaseDrag);
    })();
  </script>
</body>
</html>
