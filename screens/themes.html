<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetrofall — Themes</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .th-stage {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: var(--space-lg) var(--space-lg) var(--space-xl);
      box-sizing: border-box;
      gap: var(--space-lg);
    }

    /* ---------- Persistent bottom nav ---------- */
    /* Same markup/classes as main-menu.html's nav, reused verbatim so it's
       identical everywhere — a fixed bar outside the scrollable content. */
    .menu-icon-row {
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-lg) var(--space-lg);
      background: rgba(20, 12, 6, 0.92);
      border-top: 1px solid var(--color-panel-border);
      box-sizing: border-box;
    }

    .menu-icon-btn {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .menu-icon-btn a.btn-icon {
      text-decoration: none;
    }

    .menu-icon-btn .btn-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-icon-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--color-text-muted);
      letter-spacing: 0.02em;
      text-align: center;
    }

    .menu-icon-btn.is-active .btn-icon {
      background: rgba(242, 182, 50, 0.18);
      border-color: var(--color-gold);
      color: var(--color-gold);
    }

    .menu-icon-btn.is-active .menu-icon-label {
      color: var(--color-gold);
    }

    .th-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .th-title {
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--color-text);
      margin: 0;
    }

    .icon-coin {
      fill: var(--color-gold);
    }

    .th-coin-pill .pill-icon svg {
      width: 16px;
      height: 16px;
    }

    /* ---------- Grid ---------- */
    .th-grid {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-content: start;
      align-items: start;
      gap: var(--space-sm);
    }

    .theme-card {
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-md);
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    .theme-card.is-equipped {
      border-color: var(--color-gold);
      box-shadow: 0 0 0 2px var(--color-gold), var(--shadow-soft);
    }

    .theme-check {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 18px;
      height: 18px;
      z-index: 1;
    }

    .theme-thumb {
      aspect-ratio: 4 / 3;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 2px;
      padding: 6px;
      background: rgba(0, 0, 0, 0.2);
      box-sizing: border-box;
    }

    .theme-card.is-locked .theme-thumb {
      filter: grayscale(0.85) brightness(0.8);
    }

    .swatch-cell {
      border-radius: 3px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.25), inset 0 -1px 2px rgba(0, 0, 0, 0.3);
    }

    .theme-info {
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-align: center;
    }

    .theme-name {
      font-size: 11px;
      font-weight: 800;
      color: var(--color-text);
      letter-spacing: 0.02em;
    }

    .theme-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .theme-status.status-equipped {
      color: var(--color-gold);
      text-transform: uppercase;
    }

    .theme-status.status-unlock {
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      color: var(--color-text);
      padding: 3px 8px;
      border-radius: var(--radius-pill);
    }

    .theme-status.status-unlock svg {
      width: 11px;
      height: 11px;
    }

    .theme-status.status-locked {
      color: var(--color-text-muted);
    }

    .theme-status.status-locked svg {
      width: 13px;
      height: 13px;
      stroke: var(--color-text-muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- Per-theme swatch palettes ---------- */
    .pal-wood      { background: linear-gradient(160deg, var(--color-wood-light) 0%, var(--color-wood-mid) 55%, var(--color-wood-dark) 100%); }
    .pal-marble    { background: linear-gradient(160deg, #f2f2f2 0%, #c9c9cf 55%, #93949c 100%); }
    .pal-candy     { background: linear-gradient(160deg, #ffc4e0 0%, #ff5fa0 55%, #c72368 100%); }
    .pal-snow      { background: linear-gradient(160deg, #f2fbff 0%, #bfe3f5 55%, #7fb0d0 100%); }
    .pal-space     { background: linear-gradient(160deg, #6a4fc9 0%, #362279 55%, #150c33 100%); }
    .pal-neon      { background: linear-gradient(160deg, #ff6df0 0%, #a020ff 55%, #1de8ff 100%); }
    .pal-halloween { background: linear-gradient(160deg, #ff9a3d 0%, #d9550a 55%, #241608 100%); }
    .pal-temple    { background: linear-gradient(160deg, #ecd6a3 0%, #b98a3f 55%, #6b4a22 100%); }
    .pal-goldwood  { background: linear-gradient(160deg, #ffe9a8 0%, var(--color-gold) 55%, #8a5a12 100%); }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-toggle">
      <button type="button" class="is-active" data-size="mobile">Mobile</button>
      <button type="button" data-size="tablet">Tablet</button>
    </div>
    <div class="device-frame" id="frame">
      <div class="device-frame__screen bg-wood-grain">
        <div class="th-stage">

          <div class="th-header">
            <h1 class="th-title">Themes</h1>
            <div class="pill-counter th-coin-pill">
              <span class="pill-icon">
                <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/><path d="M12 6.5v11M8.7 9.3c0-1.1 1.2-1.9 3.3-1.9s3.3.8 3.3 1.9c0 1-.9 1.5-3.3 1.9-2.4.4-3.3.9-3.3 2 0 1.1 1.3 1.9 3.3 1.9s3.3-.8 3.3-1.9" fill="none" stroke="#4a2f1c" stroke-width="1.3" stroke-linecap="round"/></svg>
              </span>
              <span>640</span>
            </div>
          </div>

          <div class="th-grid">

            <!-- Classic Wood - equipped -->
            <div class="theme-card is-equipped">
              <svg class="theme-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-gold)"/><path d="M8 12.5l2.5 2.5L16 9" stroke="#3a2410" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <div class="theme-thumb">
                <div class="swatch-cell pal-wood"></div><div class="swatch-cell pal-wood"></div><div class="swatch-cell pal-wood"></div>
                <div class="swatch-cell pal-wood"></div><div class="swatch-cell pal-wood"></div><div class="swatch-cell pal-wood"></div>
              </div>
              <div class="theme-info">
                <span class="theme-name">Classic Wood</span>
                <span class="theme-status status-equipped">Equipped</span>
              </div>
            </div>

            <!-- Marble - unlock -->
            <div class="theme-card">
              <div class="theme-thumb">
                <div class="swatch-cell pal-marble"></div><div class="swatch-cell pal-marble"></div><div class="swatch-cell pal-marble"></div>
                <div class="swatch-cell pal-marble"></div><div class="swatch-cell pal-marble"></div><div class="swatch-cell pal-marble"></div>
              </div>
              <div class="theme-info">
                <span class="theme-name">Marble</span>
                <span class="theme-status status-unlock">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/></svg>
                  300
                </span>
              </div>
            </div>

            <!-- Candy - unlock -->
            <div class="theme-card">
              <div class="theme-thumb">
                <div class="swatch-cell pal-candy"></div><div class="swatch-cell pal-candy"></div><div class="swatch-cell pal-candy"></div>
                <div class="swatch-cell pal-candy"></div><div class="swatch-cell pal-candy"></div><div class="swatch-cell pal-candy"></div>
              </div>
              <div class="theme-info">
                <span class="theme-name">Candy</span>
                <span class="theme-status status-unlock">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/></svg>
                  450
                </span>
              </div>
            </div>

            <!-- Snow - unlock -->
            <div class="theme-card">
              <div class="theme-thumb">
                <div class="swatch-cell pal-snow"></div><div class="swatch-cell pal-snow"></div><div class="swatch-cell pal-snow"></div>
                <div class="swatch-cell pal-snow"></div><div class="swatch-cell pal-snow"></div><div class="swatch-cell pal-snow"></div>
              </div>
              <div class="theme-info">
                <span class="theme-name">Snow</span>
                <span class="theme-status status-unlock">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/></svg>
                  350
                </span>
              </div>
            </div>

            <!-- Space - unlock -->
            <div class="theme-card">
              <div class="theme-thumb">
                <div class="swatch-cell pal-space"></div><div class="swatch-cell pal-space"></div><div class="swatch-cell pal-space"></div>
                <div class="swatch-cell pal-space"></div><div class="swatch-cell pal-space"></div><div class="swatch-cell pal-space"></div>
              </div>
              <div class="theme-info">
                <span class="theme-name">Space</span>
                <span class="theme-status status-unlock">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/></svg>
                  600
                </span>
              </div>
            </div>

            <!-- Neon - locked -->
            <div class="theme-card is-locked">
              <div class="theme-thumb">
                <div class="swatch-cell pal-neon"></div><div class="swatch-cell pal-neon"></div><div class="swatch-cell pal-neon"></div>
                <div class="swatch-cell pal-neon"></div><div class="swatch-cell pal-neon"></div><div class="swatch-cell pal-neon"></div>
              </div>
              <div class="theme-info">
                <span class="theme-name">Neon</span>
                <span class="theme-status status-locked">
                  <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
                </span>
              </div>
            </div>

            <!-- Halloween - locked -->
            <div class="theme-card is-locked">
              <div class="theme-thumb">
                <div class="swatch-cell pal-halloween"></div><div class="swatch-cell pal-halloween"></div><div class="swatch-cell pal-halloween"></div>
                <div class="swatch-cell pal-halloween"></div><div class="swatch-cell pal-halloween"></div><div class="swatch-cell pal-halloween"></div>
              </div>
              <div class="theme-info">
                <span class="theme-name">Halloween</span>
                <span class="theme-status status-locked">
                  <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
                </span>
              </div>
            </div>

            <!-- Ancient Temple - unlock -->
            <div class="theme-card">
              <div class="theme-thumb">
                <div class="swatch-cell pal-temple"></div><div class="swatch-cell pal-temple"></div><div class="swatch-cell pal-temple"></div>
                <div class="swatch-cell pal-temple"></div><div class="swatch-cell pal-temple"></div><div class="swatch-cell pal-temple"></div>
              </div>
              <div class="theme-info">
                <span class="theme-name">Ancient Temple</span>
                <span class="theme-status status-unlock">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/></svg>
                  800
                </span>
              </div>
            </div>

            <!-- Golden Wood - locked -->
            <div class="theme-card is-locked">
              <div class="theme-thumb">
                <div class="swatch-cell pal-goldwood"></div><div class="swatch-cell pal-goldwood"></div><div class="swatch-cell pal-goldwood"></div>
                <div class="swatch-cell pal-goldwood"></div><div class="swatch-cell pal-goldwood"></div><div class="swatch-cell pal-goldwood"></div>
              </div>
              <div class="theme-info">
                <span class="theme-name">Golden Wood</span>
                <span class="theme-status status-locked">
                  <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
                </span>
              </div>
            </div>

          </div>

        </div>

        <!-- Persistent bottom nav — same markup as main-menu.html, reused
             verbatim so it's identical on every screen. -->
        <div class="menu-icon-row">
          <div class="menu-icon-btn">
            <a href="daily-reward.html" class="btn-icon" aria-label="Daily Reward">
              <svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M4 9h16"/><path d="M12 9v11"/><path d="M12 9c-1.5-4-6-4-6-1.2C6 9 9 9 12 9z"/><path d="M12 9c1.5-4 6-4 6-1.2C18 9 15 9 12 9z"/></svg>
              <span class="badge">1</span>
            </a>
            <span class="menu-icon-label">Daily</span>
          </div>

          <div class="menu-icon-btn is-active">
            <a href="themes.html" class="btn-icon" aria-label="Themes">
              <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1.5a2.5 2.5 0 0 0 2.5-2.5c0-.7-.3-1.3-.7-1.8-.4-.4-.6-1-.6-1.6a2 2 0 0 1 2-2H18a3 3 0 0 0 3-3c0-4.4-4-6.1-9-6.1z"/><circle cx="7.5" cy="10.5" r="1.1"/><circle cx="9.5" cy="7" r="1.1"/><circle cx="14" cy="6.8" r="1.1"/><circle cx="16.5" cy="9.5" r="1.1"/></svg>
            </a>
            <span class="menu-icon-label">Themes</span>
          </div>

          <div class="menu-icon-btn">
            <a href="achievements.html" class="btn-icon" aria-label="Achievements">
              <svg viewBox="0 0 24 24"><path d="M8 3l2 6-3 2-3-6z"/><path d="M16 3l-2 6 3 2 3-6z"/><circle cx="12" cy="15" r="6"/><circle cx="12" cy="15" r="2.5"/></svg>
            </a>
            <span class="menu-icon-label">Awards</span>
          </div>

          <div class="menu-icon-btn">
            <button type="button" class="btn-icon" aria-label="Settings">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10c.1.7.6 1.3 1.5 1.5H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </button>
            <span class="menu-icon-label">Settings</span>
          </div>

          <div class="menu-icon-btn">
            <a href="shop.html" class="btn-icon" aria-label="Shop">
              <svg viewBox="0 0 24 24"><path d="M6 9h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 9z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg>
            </a>
            <span class="menu-icon-label">Shop</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var buttons = document.querySelectorAll('.device-toggle button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        frame.classList.toggle('is-tablet', btn.dataset.size === 'tablet');
      });
    });
  </script>
</body>
</html>
