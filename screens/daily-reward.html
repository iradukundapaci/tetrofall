<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetrofall — Daily Reward</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .dr-stage {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-lg) var(--space-lg) var(--space-xl);
      box-sizing: border-box;
      gap: var(--space-lg);
    }

    .dr-header {
      flex: 0 0 auto;
      text-align: center;
    }

    .dr-title {
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--color-text);
      margin: 0 0 4px;
    }

    .dr-subtitle {
      font-size: var(--font-size-sm);
      font-weight: 700;
      color: var(--color-text-muted);
      letter-spacing: 0.04em;
    }

    /* ---------- Day grid (days 1-6) ---------- */
    .dr-grid {
      flex: 0 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-sm);
    }

    .day-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: var(--space-sm) 4px;
      border-radius: var(--radius-md);
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      box-shadow: var(--shadow-soft);
      box-sizing: border-box;
      min-height: 92px;
    }

    .day-card-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      text-transform: uppercase;
    }

    .day-card-icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .day-card-icon svg {
      width: 100%;
      height: 100%;
    }

    .day-card-reward {
      font-size: 11px;
      font-weight: 700;
      color: var(--color-text);
      text-align: center;
    }

    /* Claimed — dimmed, checkmark badge */
    .day-card.is-claimed {
      opacity: 0.55;
    }

    .day-card.is-claimed .day-check {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
    }

    /* Today — highlighted, scaled up */
    .day-card.is-today {
      background: rgba(242, 182, 50, 0.14);
      border-color: var(--color-gold);
      box-shadow: 0 0 0 2px var(--color-gold), var(--shadow-lift);
      transform: scale(1.08);
      animation: todayGlow 1.8s ease-in-out infinite;
    }

    @keyframes todayGlow {
      0%, 100% { box-shadow: 0 0 0 2px var(--color-gold), 0 0 10px rgba(242, 182, 50, 0.25), var(--shadow-lift); }
      50%      { box-shadow: 0 0 0 2px var(--color-gold), 0 0 18px rgba(242, 182, 50, 0.55), var(--shadow-lift); }
    }

    .day-card.is-today .day-card-label {
      color: var(--color-gold);
    }

    /* Locked — greyed, lock icon overlay */
    .day-card.is-locked {
      opacity: 0.5;
    }

    .day-card.is-locked .day-card-icon,
    .day-card.is-locked .day-card-reward {
      filter: grayscale(1);
    }

    .day-lock {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 13px;
      height: 13px;
      opacity: 0.85;
    }

    /* ---------- Day 7 hero card ---------- */
    .dr-hero {
      flex: 0 0 auto;
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      border-radius: var(--radius-lg);
      background: linear-gradient(160deg, rgba(242, 182, 50, 0.16) 0%, var(--color-panel) 70%);
      border: 1px solid rgba(242, 182, 50, 0.35);
      box-shadow: var(--shadow-soft);
      opacity: 0.6;
      box-sizing: border-box;
    }

    .dr-hero-icon {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      filter: grayscale(1);
    }

    .dr-hero-icon svg {
      width: 100%;
      height: 100%;
    }

    .dr-hero-text {
      flex: 1 1 auto;
      filter: grayscale(1);
    }

    .dr-hero-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      text-transform: uppercase;
      display: block;
    }

    .dr-hero-reward {
      font-family: var(--font-display);
      font-size: var(--font-size-md);
      font-weight: 800;
      color: var(--color-text);
    }

    .dr-hero .day-lock {
      top: var(--space-md);
      right: var(--space-md);
      width: 18px;
      height: 18px;
      opacity: 1;
      filter: none;
    }

    /* ---------- Claim button ---------- */
    .dr-claim-wrap {
      flex: 1 1 auto;
      width: 100%;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: stretch;
      gap: var(--space-xs);
    }

    .dr-claim-note {
      text-align: center;
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      font-weight: 600;
    }

    .dr-claim-note strong {
      color: var(--color-text);
    }

    .dr-claim-btn {
      width: 100%;
      padding: 18px 0;
      font-size: var(--font-size-lg);
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-toggle">
      <button type="button" class="is-active" data-size="mobile">Mobile</button>
      <button type="button" data-size="tablet">Tablet</button>
    </div>
    <div class="device-frame" id="frame">
      <div class="device-frame__screen bg-wood-grain">

        <!-- Dimmed sliver of main-menu peeking above the sheet -->
        <div class="sheet-bg">
          <div class="menu-topbar-bg">
            <div class="pill-counter">
              <span class="pill-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M8 3h8v4a4 4 0 0 1-8 0V3z"/>
                  <path d="M12 9l1.2 2.4 2.6.4-1.9 1.8.4 2.5L12 15l-2.3 1.2.4-2.5-1.9-1.8 2.6-.4L12 9z"/>
                  <path d="M12 16v2"/>
                  <path d="M9 20h6"/>
                </svg>
              </span>
              <span>10,140</span>
            </div>
            <div class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10c.1.7.6 1.3 1.5 1.5H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </div>
          </div>
        </div>

        <div class="sheet-overlay">
          <div class="sheet-scrim"></div>
          <div class="bottom-sheet">
            <div class="sheet-handle-row">
              <span class="sheet-handle"></span>
            </div>

        <div class="dr-stage">

          <div class="dr-header">
            <h1 class="dr-title">Daily Rewards</h1>
            <div class="screen-header-right">
              <span class="dr-subtitle">DAY 4 OF 7</span>
            </div>
          </div>

          <div class="dr-grid">

            <!-- Day 1 - claimed -->
            <div class="day-card is-claimed">
              <span class="day-card-label">Day 1</span>
              <span class="day-card-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-gold)"/><path d="M12 6.5v11M8.7 9.3c0-1.1 1.2-1.9 3.3-1.9s3.3.8 3.3 1.9c0 1-.9 1.5-3.3 1.9-2.4.4-3.3.9-3.3 2 0 1.1 1.3 1.9 3.3 1.9s3.3-.8 3.3-1.9" fill="none" stroke="var(--color-wood-dark)" stroke-width="1.3" stroke-linecap="round"/></svg>
              </span>
              <span class="day-card-reward">50 Coins</span>
              <svg class="day-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-green)"/><path d="M8 12.5l2.5 2.5L16 9" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>

            <!-- Day 2 - claimed -->
            <div class="day-card is-claimed">
              <span class="day-card-label">Day 2</span>
              <span class="day-card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-red)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="14" r="6.5"/><path d="M12 7.5V5"/><path d="M12 5c1-1.3 2.3-1.3 2.8-2.6"/><circle cx="15.2" cy="1.7" r="1" fill="var(--color-red)" stroke="none"/></svg>
              </span>
              <span class="day-card-reward">Bomb x1</span>
              <svg class="day-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-green)"/><path d="M8 12.5l2.5 2.5L16 9" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>

            <!-- Day 3 - claimed -->
            <div class="day-card is-claimed">
              <span class="day-card-label">Day 3</span>
              <span class="day-card-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-gold)"/><path d="M12 6.5v11M8.7 9.3c0-1.1 1.2-1.9 3.3-1.9s3.3.8 3.3 1.9c0 1-.9 1.5-3.3 1.9-2.4.4-3.3.9-3.3 2 0 1.1 1.3 1.9 3.3 1.9s3.3-.8 3.3-1.9" fill="none" stroke="var(--color-wood-dark)" stroke-width="1.3" stroke-linecap="round"/></svg>
              </span>
              <span class="day-card-reward">100 Coins</span>
              <svg class="day-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-green)"/><path d="M8 12.5l2.5 2.5L16 9" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>

            <!-- Day 4 - today (active) -->
            <div class="day-card is-today">
              <span class="day-card-label">Day 4</span>
              <span class="day-card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-gold)" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h5"/><path d="M8 9h4v6H8z"/><path d="M12 10h3.5v4H12z"/><path d="M15.5 11.5H19"/></svg>
              </span>
              <span class="day-card-reward">Drill x1</span>
            </div>

            <!-- Day 5 - locked -->
            <div class="day-card is-locked">
              <span class="day-card-label">Day 5</span>
              <span class="day-card-icon">
                <svg viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H10L9 22l9-13H12z" fill="var(--color-text-muted)"/></svg>
              </span>
              <span class="day-card-reward">Lightning x1</span>
              <svg class="day-lock" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
            </div>

            <!-- Day 6 - locked -->
            <div class="day-card is-locked">
              <span class="day-card-label">Day 6</span>
              <span class="day-card-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-text-muted)"/><path d="M12 6.5v11M8.7 9.3c0-1.1 1.2-1.9 3.3-1.9s3.3.8 3.3 1.9c0 1-.9 1.5-3.3 1.9-2.4.4-3.3.9-3.3 2 0 1.1 1.3 1.9 3.3 1.9s3.3-.8 3.3-1.9" fill="none" stroke="#2b1c12" stroke-width="1.3" stroke-linecap="round"/></svg>
              </span>
              <span class="day-card-reward">200 Coins</span>
              <svg class="day-lock" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
            </div>

          </div>

          <!-- Day 7 - locked hero card -->
          <div class="dr-hero">
            <span class="dr-hero-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="9" rx="1.5"/><path d="M4 10a8 6 0 0 1 16 0"/><circle cx="12" cy="14.5" r="1.3" fill="var(--color-text-muted)" stroke="none"/></svg>
            </span>
            <span class="dr-hero-text">
              <span class="dr-hero-label">Day 7</span>
              <span class="dr-hero-reward">Mystery Chest</span>
            </span>
            <svg class="day-lock" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></svg>
          </div>

          <div class="dr-claim-wrap">
            <span class="dr-claim-note">Day 4 reward: <strong>1x Drill Booster</strong></span>
            <button type="button" class="btn-primary dr-claim-btn">Claim</button>
          </div>

        </div>

            </div>
          </div>

      </div>
    </div>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var buttons = document.querySelectorAll('.device-toggle button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        frame.classList.toggle('is-tablet', btn.dataset.size === 'tablet');
      });
    });

    // Drag-to-dismiss — swipe the sheet down (or tap the dimmed scrim) to
    // close and return to the main menu, mocking the real gesture-based close.
    (function () {
      var sheet = document.querySelector('.bottom-sheet');
      var handle = document.querySelector('.sheet-handle-row');
      var scrim = document.querySelector('.sheet-scrim');
      if (!sheet || !handle) return;

      if (scrim) {
        scrim.addEventListener('click', function () {
          window.location.href = 'main-menu.html';
        });
      }

      var startY = 0;
      var dragY = 0;
      var dragging = false;

      handle.addEventListener('pointerdown', function (e) {
        dragging = true;
        startY = e.clientY;
        sheet.style.transition = 'none';
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        dragY = Math.max(0, e.clientY - startY);
        sheet.style.transform = 'translateY(' + dragY + 'px)';
      });

      function releaseDrag() {
        if (!dragging) return;
        dragging = false;
        sheet.style.transition = 'transform 0.25s ease';
        if (dragY > 120) {
          sheet.style.transform = 'translateY(100%)';
          setTimeout(function () {
            window.location.href = 'main-menu.html';
          }, 180);
        } else {
          sheet.style.transform = 'translateY(0)';
        }
        dragY = 0;
      }

      handle.addEventListener('pointerup', releaseDrag);
      handle.addEventListener('pointercancel', releaseDrag);
    })();
  </script>
</body>
</html>
