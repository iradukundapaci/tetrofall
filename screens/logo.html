<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetrofall — Logo</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .logo-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-stage img {
      width: min(60vw, 320px);
      height: auto;
      display: block;
      /* Source art is dark ink on a flat white rectangle, which reads as a
         harsh box on the dark wood background. Multiply-blending drops the
         white field out entirely (white * background = background) while
         keeping the ink black (black * anything = black), so only the black
         linework shows against the page with no visible edge. */
      mix-blend-mode: multiply;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-toggle">
      <button type="button" class="is-active" data-size="mobile">Mobile</button>
      <button type="button" data-size="tablet">Tablet</button>
    </div>
    <div class="device-frame" id="frame">
      <div class="device-frame__screen bg-wood-grain">
        <div class="logo-stage">
          <img src="assets/logo.svg" alt="Tetrofall logo" />
        </div>
      </div>
    </div>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var buttons = document.querySelectorAll('.device-toggle button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        frame.classList.toggle('is-tablet', btn.dataset.size === 'tablet');
      });
    });
  </script>
</body>
</html>
