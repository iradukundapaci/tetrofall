<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetrofall — Pause</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    /* ---------- Background: a frozen snapshot of gameplay.html ---------- */
    /* Same board/topbar/booster styles as gameplay.html, reused so the
       paused frame reads as "this exact game, dimmed" rather than a
       generic backdrop. */
    .game-stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: var(--space-md);
      box-sizing: border-box;
      gap: var(--space-sm);
    }

    /* ---------- Top bar ---------- */
    .game-topbar {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .game-coin-pill {
      justify-self: start;
    }

    .icon-coin {
      fill: var(--color-gold);
    }

    .game-score {
      justify-self: center;
      text-align: center;
      line-height: 1.1;
    }

    .game-score-current {
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: 800;
      color: var(--color-text);
    }

    .game-score-best {
      font-size: var(--font-size-xs);
      font-weight: 700;
      color: var(--color-text-muted);
      letter-spacing: 0.04em;
    }

    .game-pause {
      justify-self: end;
    }

    .game-pause svg {
      width: 18px;
      height: 18px;
    }

    /* ---------- Reserved combo callout space ---------- */
    .game-combo-zone {
      flex: 0 0 auto;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .combo-text {
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--color-gold);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), 0 0 16px rgba(242, 182, 50, 0.5);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .combo-text.is-active {
      opacity: 1;
      transform: scale(1);
    }

    /* ---------- Board ---------- */
    .game-board-wrap {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    /* Play-area boundary — the frame that visibly marks where the board
       starts/ends, distinct from the wood-grain page behind it. Width and
       height are set precisely in JS (sizeBoard below) rather than via a
       CSS aspect-ratio, because 10 columns / 16 rows don't share the same
       gap count on each axis (9 gaps vs 15) — a flat ratio leaves cells a
       fraction of a pixel off-square. max-height/width here are just the
       pre-JS fallback. */
    .game-board-frame {
      max-height: 100%;
      max-width: 100%;
      padding: 4px;
      border-radius: 12px;
      border: 3px solid rgba(245, 234, 217, 0.3);
      background: rgba(0, 0, 0, 0.28);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.35);
      box-sizing: border-box;
    }

    .game-board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(16, 1fr);
      gap: 3px;
    }

    .board-cell {
      position: relative;
      border-radius: 7px;
    }

    .block-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .block-icon svg {
      width: 55%;
      height: 55%;
    }

    /* Empty cell — open play space, awaiting the stack to rise into it */
    .block--empty {
      background: rgba(0, 0, 0, 0.18);
      border: 1px dashed rgba(255, 255, 255, 0.08);
    }

    /* Wood — base texture, most common block */
    .block--wood {
      background: linear-gradient(160deg, var(--color-wood-light) 0%, var(--color-wood-mid) 55%, var(--color-wood-dark) 100%);
      border: 1px solid rgba(0, 0, 0, 0.35);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.25), inset 0 -2px 3px rgba(0, 0, 0, 0.3);
    }

    /* Currently-falling piece — same wood texture, lifted with a glow ring */
    .block--wood.is-falling {
      transform: scale(0.92);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5), inset 0 2px 3px rgba(255, 255, 255, 0.3);
      outline: 2px solid rgba(242, 182, 50, 0.55);
      outline-offset: -2px;
      animation: fallingGlow 1.6s ease-in-out infinite;
    }

    @keyframes fallingGlow {
      0%, 100% { outline-color: rgba(242, 182, 50, 0.3); }
      50%      { outline-color: rgba(242, 182, 50, 0.75); }
    }

    /* Stone — grey, heavier, no crack lines */
    .block--stone {
      background: linear-gradient(160deg, #a3a3a3 0%, #6d6d6d 55%, #444444 100%);
      border: 1px solid rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.18), inset 0 -2px 3px rgba(0, 0, 0, 0.35);
    }

    /* Ice — semi-transparent blue overlay on wood; cracks after 1 hit */
    .block--ice {
      background:
        linear-gradient(rgba(58, 160, 217, 0.38), rgba(58, 160, 217, 0.38)),
        linear-gradient(160deg, var(--color-wood-light) 0%, var(--color-wood-mid) 55%, var(--color-wood-dark) 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.35), inset 0 -2px 3px rgba(0, 0, 0, 0.25);
    }

    .block--ice.is-cracked::before,
    .block--ice.is-cracked::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.65);
      width: 1.5px;
    }

    .block--ice.is-cracked::before {
      top: 12%;
      left: 55%;
      height: 65%;
      transform: rotate(20deg);
    }

    .block--ice.is-cracked::after {
      top: 40%;
      left: 30%;
      height: 40%;
      transform: rotate(-28deg);
    }

    /* Bomb — red accent, fuse icon */
    .block--bomb {
      background: linear-gradient(160deg, #d97a68 0%, var(--color-red) 55%, #7d1f14 100%);
      border: 1px solid rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.25), inset 0 -2px 3px rgba(0, 0, 0, 0.3);
    }

    /* Gold — gold accent, shine highlight */
    .block--gold {
      background: linear-gradient(160deg, #ffe28a 0%, var(--color-gold) 55%, #b9791a 100%);
      border: 1px solid rgba(0, 0, 0, 0.35);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.5), inset 0 -2px 3px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .block--gold::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -20%;
      width: 40%;
      height: 200%;
      background: rgba(255, 255, 255, 0.55);
      transform: rotate(25deg);
    }

    /* Diamond — blue accent, faceted icon */
    .block--diamond {
      background: linear-gradient(160deg, #9adcf7 0%, var(--color-blue) 55%, #1c6e94 100%);
      border: 1px solid rgba(0, 0, 0, 0.35);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.4), inset 0 -2px 3px rgba(0, 0, 0, 0.3);
    }

    /* Treasure — wood base, chest icon overlay */
    .block--treasure {
      background: linear-gradient(160deg, var(--color-wood-light) 0%, var(--color-wood-mid) 55%, var(--color-wood-dark) 100%);
      border: 1px solid rgba(0, 0, 0, 0.35);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.25), inset 0 -2px 3px rgba(0, 0, 0, 0.3);
    }

    /* Locked — darkened, lock icon, paired key indicator */
    .block--locked {
      background: linear-gradient(160deg, #565656 0%, #333333 55%, #181818 100%);
      border: 1px solid rgba(0, 0, 0, 0.5);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.12), inset 0 -2px 3px rgba(0, 0, 0, 0.4);
    }

    .key-indicator {
      position: absolute;
      bottom: 3px;
      right: 3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-gold);
      box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.4);
    }

    /* Rainbow — multicolor gradient fill */
    .block--rainbow {
      background: conic-gradient(from 0deg, var(--color-red), var(--color-gold), var(--color-green), var(--color-blue), var(--color-purple), var(--color-red));
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.3), inset 0 -2px 3px rgba(0, 0, 0, 0.2);
    }

    /* ---------- Booster panel ---------- */
    .game-boosters {
      flex: 0 0 auto;
      display: flex;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .booster-slot {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .booster-slot .btn-icon {
      width: 52px;
      height: 52px;
    }

    .booster-slot .btn-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .booster-slot .btn-icon .badge {
      background: var(--color-gold);
      color: var(--color-wood-dark);
    }

    .pause-bg {
      filter: blur(4px);
      opacity: 0.4;
      pointer-events: none;
      user-select: none;
    }

    /* Paused means frozen — kill the falling-piece glow and any other
       background motion rather than let it animate under the blur. */
    .pause-bg,
    .pause-bg * {
      animation: none !important;
      transition: none !important;
    }

    /* ---------- Pause modal ---------- */
    .pause-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      box-sizing: border-box;
    }

    .pause-panel {
      width: 100%;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: var(--space-md);
      text-align: center;
      background: rgba(20, 12, 6, 0.88);
      backdrop-filter: blur(2px);
      /* Modal open state — fade + scale in, mocking the transition since
         there's no real "pause tapped" trigger in a static HTML file. */
      animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }

    .pause-panel a {
      text-decoration: none;
    }

    .pause-title {
      font-family: var(--font-display);
      font-size: var(--font-size-xxl);
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--color-text);
      margin: 0 0 var(--space-xs);
    }

    .pause-panel .btn-secondary {
      width: 100%;
    }

    /* Quit — visually lightest: no fill, no border, just text */
    .pause-btn-quit {
      background: none;
      border: none;
      color: var(--color-text-muted);
      font-family: var(--font-display);
      font-size: var(--font-size-md);
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 8px;
      cursor: pointer;
      transition: color 0.15s ease, transform 0.12s ease;
    }

    .pause-btn-quit:active {
      transform: scale(0.95);
    }

    .pause-btn-quit:hover {
      color: var(--color-text);
    }
  </style>
</head>

  <script>
    var frame = document.getElementById('frame');
    var buttons = document.querySelectorAll('.device-toggle button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        frame.classList.toggle('is-tablet', btn.dataset.size === 'tablet');
      });
    });

    // Same pixel-exact square-cell sizing as gameplay.html, so the frozen
    // board behind the modal lines up identically.
    (function () {
      var COLS = 10, ROWS = 16, GAP = 3, PAD = 4;
      var wrap = document.querySelector('.game-board-wrap');
      var boardFrame = document.querySelector('.game-board-frame');

      function sizeBoard() {
        var availW = wrap.clientWidth;
        var availH = wrap.clientHeight;
        if (!availW || !availH) return;

        var cellFromWidth = (availW - 2 * PAD - (COLS - 1) * GAP) / COLS;
        var cellFromHeight = (availH - 2 * PAD - (ROWS - 1) * GAP) / ROWS;
        var cell = Math.floor(Math.min(cellFromWidth, cellFromHeight));

        boardFrame.style.width = (cell * COLS + (COLS - 1) * GAP + 2 * PAD) + 'px';
        boardFrame.style.height = (cell * ROWS + (ROWS - 1) * GAP + 2 * PAD) + 'px';
      }

      if (window.ResizeObserver) {
        new ResizeObserver(sizeBoard).observe(wrap);
      } else {
        window.addEventListener('resize', sizeBoard);
        sizeBoard();
      }
    })();
  </script>
