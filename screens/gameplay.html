<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetrofall — Gameplay</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .game-stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: var(--space-md);
      box-sizing: border-box;
      gap: var(--space-sm);
    }

    /* ---------- Top bar ---------- */
    .game-topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .game-score {
      text-align: center;
      line-height: 1.1;
    }

    .game-score-current {
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: 800;
      color: var(--color-text);
    }

    .game-score-best {
      font-size: var(--font-size-xs);
      font-weight: 700;
      color: var(--color-text-muted);
      letter-spacing: 0.04em;
    }

    .game-pause {
      text-decoration: none;
    }

    .game-pause svg {
      width: 18px;
      height: 18px;
    }

    /* ---------- Reserved combo callout space ---------- */
    .game-combo-zone {
      flex: 0 0 auto;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .combo-text {
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--color-gold);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), 0 0 16px rgba(242, 182, 50, 0.5);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .combo-text.is-active {
      opacity: 1;
      transform: scale(1);
    }

    /* ---------- Board ---------- */
    .game-board-wrap {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    /* Play-area boundary — the frame that visibly marks where the board
       starts/ends, distinct from the wood-grain page behind it. Width and
       height are set precisely in JS (sizeBoard below) rather than via a
       CSS aspect-ratio, because 10 columns / 16 rows don't share the same
       gap count on each axis (9 gaps vs 15) — a flat ratio leaves cells a
       fraction of a pixel off-square. max-height/width here are just the
       pre-JS fallback. */
    .game-board-frame {
      max-height: 100%;
      max-width: 100%;
      padding: 4px;
      border-radius: 12px;
      border: 3px solid rgba(245, 234, 217, 0.3);
      background: rgba(0, 0, 0, 0.28);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.55), 0 4px 12px rgba(0, 0, 0, 0.35);
      box-sizing: border-box;
    }

    .game-board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(16, 1fr);
      gap: 3px;
    }

    .board-cell {
      position: relative;
      border-radius: 7px;
    }

    /* Empty cell — open play space, awaiting the stack to rise into it */
    .block--empty {
      background: rgba(0, 0, 0, 0.18);
      border: 1px dashed rgba(255, 255, 255, 0.08);
    }

    /* Wood — base texture, most common block */
    .block--wood {
      background: linear-gradient(160deg, var(--color-wood-light) 0%, var(--color-wood-mid) 55%, var(--color-wood-dark) 100%);
      border: 1px solid rgba(0, 0, 0, 0.35);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.25), inset 0 -2px 3px rgba(0, 0, 0, 0.3);
    }

    /* Currently-falling piece — same wood texture, lifted with a glow ring */
    .block--wood.is-falling {
      transform: scale(0.92);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5), inset 0 2px 3px rgba(255, 255, 255, 0.3);
      outline: 2px solid rgba(242, 182, 50, 0.55);
      outline-offset: -2px;
      animation: fallingGlow 1.6s ease-in-out infinite;
    }

    @keyframes fallingGlow {
      0%, 100% { outline-color: rgba(242, 182, 50, 0.3); }
      50%      { outline-color: rgba(242, 182, 50, 0.75); }
    }

    /* Stone — grey, heavier, no crack lines */
    .block--stone {
      background: linear-gradient(160deg, #a3a3a3 0%, #6d6d6d 55%, #444444 100%);
      border: 1px solid rgba(0, 0, 0, 0.4);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.18), inset 0 -2px 3px rgba(0, 0, 0, 0.35);
    }

    /* Ice — semi-transparent blue overlay on wood; cracks after 1 hit */
    .block--ice {
      background:
        linear-gradient(rgba(58, 160, 217, 0.38), rgba(58, 160, 217, 0.38)),
        linear-gradient(160deg, var(--color-wood-light) 0%, var(--color-wood-mid) 55%, var(--color-wood-dark) 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.35), inset 0 -2px 3px rgba(0, 0, 0, 0.25);
    }

    .block--ice.is-cracked::before,
    .block--ice.is-cracked::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.65);
      width: 1.5px;
    }

    .block--ice.is-cracked::before {
      top: 12%;
      left: 55%;
      height: 65%;
      transform: rotate(20deg);
    }

    .block--ice.is-cracked::after {
      top: 40%;
      left: 30%;
      height: 40%;
      transform: rotate(-28deg);
    }

    /* ---------- Banner ad slot ---------- */
    /* Reserved space below the play area for a standard mobile banner
       (320x50 adaptive). Swap the placeholder for the real ad SDK's view
       once integrated — the height is fixed so the board above it doesn't
       shift when the ad loads. */
    .game-ad-banner {
      flex: 0 0 auto;
      width: 100%;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px dashed rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      box-sizing: border-box;
    }

    .game-ad-banner-label {
      font-size: var(--font-size-xs);
      font-weight: 700;
      color: var(--color-text-muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

  </style>
</head>

  <script>
    var frame = document.getElementById('frame');
    var buttons = document.querySelectorAll('.device-toggle button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        frame.classList.toggle('is-tablet', btn.dataset.size === 'tablet');
      });
    });

    // Force the board frame to a pixel-exact size so every cell is a true
    // square. A flat CSS aspect-ratio can't do this: 10 columns share 9
    // gaps while 16 rows share 15, so the two axes don't scale in lockstep.
    // Instead measure the available box, solve for the largest whole-pixel
    // cell size that fits both axes, then size the frame to exactly match.
    (function () {
      var COLS = 10, ROWS = 16, GAP = 3, PAD = 4;
      var wrap = document.querySelector('.game-board-wrap');
      var boardFrame = document.querySelector('.game-board-frame');

      function sizeBoard() {
        var availW = wrap.clientWidth;
        var availH = wrap.clientHeight;
        if (!availW || !availH) return;

        var cellFromWidth = (availW - 2 * PAD - (COLS - 1) * GAP) / COLS;
        var cellFromHeight = (availH - 2 * PAD - (ROWS - 1) * GAP) / ROWS;
        var cell = Math.floor(Math.min(cellFromWidth, cellFromHeight));

        boardFrame.style.width = (cell * COLS + (COLS - 1) * GAP + 2 * PAD) + 'px';
        boardFrame.style.height = (cell * ROWS + (ROWS - 1) * GAP + 2 * PAD) + 'px';
      }

      if (window.ResizeObserver) {
        new ResizeObserver(sizeBoard).observe(wrap);
      } else {
        window.addEventListener('resize', sizeBoard);
        sizeBoard();
      }
    })();

    // Combo callout: resting state is empty; this just cycles the
    // "triggered" tiers on a loop so both states are visible over time
    // without a manual control.
    var comboMessages = ['GOOD!', 'AWESOME!', 'INCREDIBLE!', 'UNBELIEVABLE!'];
    var comboEl = document.getElementById('comboText');
    var comboIndex = 0;

    function showCombo() {
      comboEl.textContent = comboMessages[comboIndex % comboMessages.length];
      comboIndex++;
      comboEl.classList.add('is-active');
      setTimeout(function () {
        comboEl.classList.remove('is-active');
      }, 1100);
    }

    setTimeout(function () {
      showCombo();
      setInterval(showCombo, 3200);
    }, 900);
  </script>
