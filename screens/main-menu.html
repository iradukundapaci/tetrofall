<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetrofall — Main Menu</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .menu-stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-lg) var(--space-lg) var(--space-xl);
      box-sizing: border-box;
    }

    /* Top: highest score, small and out of the way */
    .menu-topbar {
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .menu-score-pill .pill-icon svg {
      width: 100px;
      height: 100px;
      fill: var(--color-gold);
    }

    .menu-score-label {
      color: var(--color-text-muted);
      font-size: var(--font-size-xs);
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-right: 2px;
    }

    /* Middle: play button, vertically centered in remaining space */
    .menu-center {
      flex: 1 1 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Placeholder slot for a looping gameplay video (to be dropped in
       later, above the PLAY button). Swap this div's contents for a
       <video> (muted, autoplay, loop, playsinline) once the clip is
       ready — it's empty for now. */
    .menu-video-slot {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* PLAY — the one large/bright element on the whole screen */
    .btn-play {
      padding: 20px 64px;
      font-size: var(--font-size-xl);
      border-radius: var(--radius-lg);
      letter-spacing: 0.04em;
    }

    /* Bottom: row of secondary icon buttons */
    .menu-icon-row {
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .menu-icon-btn {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .menu-icon-btn .btn-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-icon-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--color-text-muted);
      letter-spacing: 0.02em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-toggle">
      <button type="button" class="is-active" data-size="mobile">Mobile</button>
      <button type="button" data-size="tablet">Tablet</button>
    </div>
    <div class="device-frame" id="frame">
      <div class="device-frame__screen bg-wood-grain">
        <div class="menu-stage">

          <div class="menu-topbar">
            <div class="pill-counter menu-score-pill">
              <span class="menu-score-label">BEST</span>
              <span class="pill-icon">
<svg viewBox="0 0 24 24">
  <path d="M8 3h8v4a4 4 0 0 1-8 0V3z"/>
  <path d="M12 9l1.2 2.4 2.6.4-1.9 1.8.4 2.5L12 15l-2.3 1.2.4-2.5-1.9-1.8 2.6-.4L12 9z"/>
  <path d="M12 16v2"/>
  <path d="M9 20h6"/>
</svg>
              </span>
              <span>10,140</span>
            </div>
          </div>

          <div class="menu-center">
            <!-- Video placeholder: drop a <video muted autoplay loop playsinline> in here once the gameplay clip is ready -->
            <div class="menu-video-slot"></div>

            <button type="button" class="btn-primary btn-play">PLAY</button>
          </div>

          <div class="menu-icon-row">
            <div class="menu-icon-btn">
              <button type="button" class="btn-icon" aria-label="Daily Reward">
                <svg viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M4 9h16"/><path d="M12 9v11"/><path d="M12 9c-1.5-4-6-4-6-1.2C6 9 9 9 12 9z"/><path d="M12 9c1.5-4 6-4 6-1.2C18 9 15 9 12 9z"/></svg>
                <span class="badge">1</span>
              </button>
              <span class="menu-icon-label">Daily</span>
            </div>

            <div class="menu-icon-btn">
              <button type="button" class="btn-icon" aria-label="Themes">
                <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1.5a2.5 2.5 0 0 0 2.5-2.5c0-.7-.3-1.3-.7-1.8-.4-.4-.6-1-.6-1.6a2 2 0 0 1 2-2H18a3 3 0 0 0 3-3c0-4.4-4-6.1-9-6.1z"/><circle cx="7.5" cy="10.5" r="1.1"/><circle cx="9.5" cy="7" r="1.1"/><circle cx="14" cy="6.8" r="1.1"/><circle cx="16.5" cy="9.5" r="1.1"/></svg>
              </button>
              <span class="menu-icon-label">Themes</span>
            </div>

            <div class="menu-icon-btn">
              <button type="button" class="btn-icon" aria-label="Achievements">
                <svg viewBox="0 0 24 24"><path d="M8 3l2 6-3 2-3-6z"/><path d="M16 3l-2 6 3 2 3-6z"/><circle cx="12" cy="15" r="6"/><circle cx="12" cy="15" r="2.5"/></svg>
              </button>
              <span class="menu-icon-label">Awards</span>
            </div>

            <div class="menu-icon-btn">
              <button type="button" class="btn-icon" aria-label="Settings">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10c.1.7.6 1.3 1.5 1.5H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
              </button>
              <span class="menu-icon-label">Settings</span>
            </div>

            <div class="menu-icon-btn">
              <button type="button" class="btn-icon" aria-label="Shop">
                <svg viewBox="0 0 24 24"><path d="M6 9h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 9z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/></svg>
              </button>
              <span class="menu-icon-label">Shop</span>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var buttons = document.querySelectorAll('.device-toggle button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        frame.classList.toggle('is-tablet', btn.dataset.size === 'tablet');
      });
    });
  </script>
</body>
</html>
