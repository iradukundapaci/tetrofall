<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetrofall — Main Menu</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .menu-stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--space-lg) var(--space-lg) var(--space-xl);
      box-sizing: border-box;
    }

    /* Top: highest score on the left, settings on the right */
    .menu-topbar {
      flex: 0 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .menu-score-pill .pill-icon svg {
      width: 16px;
      height: 16px;
      fill: var(--color-gold);
    }

    .menu-score-label {
      color: var(--color-text-muted);
      font-size: var(--font-size-xs);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* Middle: play button, vertically centered in remaining space, with
       the "No Ads" upsell sitting just below it. */
    .menu-center {
      flex: 1 1 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
    }

    /* Placeholder slot for a looping gameplay video (to be dropped in
       later, above the PLAY button). Swap this div's contents for a
       <video> (muted, autoplay, loop, playsinline) once the clip is
       ready — it's empty for now. */
    .menu-video-slot {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* PLAY — the one large/bright element on the whole screen. It's an <a>
       (links to gameplay.html) styled as .btn-primary, so strip link defaults. */
    .btn-play {
      width: 100%;
      max-width: 160px;
      box-sizing: border-box;
      padding: 14px 0;
      font-size: var(--font-size-md);
      border-radius: var(--radius-lg);
      letter-spacing: 0.04em;
      text-decoration: none;
      text-align: center;
    }

    /* No Ads — secondary upsell CTA below PLAY. Triggers a mock purchase
       directly (no navigation) — in the real app this opens the platform
       payment sheet; here the button just flips to a "purchased" state. */
    .btn-noads {
      width: 100%;
      max-width: 200px;
      box-sizing: border-box;
      padding: 10px 0;
      font-size: var(--font-size-sm);
      text-decoration: none;
    }

    .btn-noads svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-noads.is-purchased {
      background: rgba(242, 182, 50, 0.18);
      border-color: var(--color-gold);
      color: var(--color-gold);
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-toggle">
      <button type="button" class="is-active" data-size="mobile">Mobile</button>
      <button type="button" data-size="tablet">Tablet</button>
    </div>
    <div class="device-frame" id="frame">
      <div class="device-frame__screen bg-wood-grain">
        <div class="menu-stage">

          <div class="menu-topbar">
            <div class="pill-counter menu-score-pill">
              <span class="menu-score-label">BEST</span>
              <span class="pill-icon">
<svg viewBox="0 0 24 24">
  <path d="M8 3h8v4a4 4 0 0 1-8 0V3z"/>
  <path d="M12 9l1.2 2.4 2.6.4-1.9 1.8.4 2.5L12 15l-2.3 1.2.4-2.5-1.9-1.8 2.6-.4L12 9z"/>
  <path d="M12 16v2"/>
  <path d="M9 20h6"/>
</svg>
              </span>
              <span>10,140</span>
            </div>
            <a href="settings.html" class="btn-icon header-settings-btn" aria-label="Settings">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10c.1.7.6 1.3 1.5 1.5H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </a>
          </div>

          <div class="menu-center">
            <!-- Video placeholder: drop a <video muted autoplay loop playsinline> in here once the gameplay clip is ready -->
            <div class="menu-video-slot"></div>

            <a href="gameplay.html" class="btn-primary btn-play">PLAY</a>

            <button type="button" class="btn-secondary btn-noads" id="noAdsBtn">
              <svg id="noAdsIcon" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M2 2l20 20"/><path d="M17.5 8.5a5 5 0 0 1 0 7"/></svg>
              <span id="noAdsLabel">No Ads — $2.99</span>
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var buttons = document.querySelectorAll('.device-toggle button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        frame.classList.toggle('is-tablet', btn.dataset.size === 'tablet');
      });
    });

    // No Ads — mock the platform payment sheet completing successfully.
    // No navigation: the button just flips to a purchased/disabled state.
    var noAdsBtn = document.getElementById('noAdsBtn');
    var noAdsLabel = document.getElementById('noAdsLabel');
    var noAdsIcon = document.getElementById('noAdsIcon');
    if (noAdsBtn) {
      noAdsBtn.addEventListener('click', function () {
        if (noAdsBtn.classList.contains('is-purchased')) return;
        noAdsBtn.classList.add('is-purchased');
        noAdsLabel.textContent = 'Ads Removed';
        noAdsIcon.innerHTML = '<path d="M20 6 9 17l-5-5"/>';
        noAdsBtn.disabled = true;
      });
    }
  </script>
</body>
</html>
