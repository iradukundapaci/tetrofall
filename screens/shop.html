<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetrofall — Shop</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <style>
    .sh-stage {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: var(--space-lg) var(--space-lg) var(--space-xl);
      box-sizing: border-box;
      gap: var(--space-lg);
    }

    .sh-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sh-title {
      font-family: var(--font-display);
      font-size: var(--font-size-xl);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--color-text);
      margin: 0;
    }

    .icon-coin {
      fill: var(--color-gold);
    }

    .sh-coin-pill .pill-icon svg {
      width: 16px;
      height: 16px;
    }

    /* ---------- Starter Pack hero ---------- */
    .sh-hero {
      position: relative;
      flex: 0 0 auto;
      padding: var(--space-md);
      padding-top: calc(var(--space-md) + 6px);
      border-radius: var(--radius-lg);
      background: linear-gradient(160deg, rgba(242, 182, 50, 0.22) 0%, var(--color-panel) 75%);
      border: 1px solid var(--color-gold);
      box-shadow: 0 0 0 1px rgba(242, 182, 50, 0.3), var(--shadow-lift);
    }

    .sh-ribbon {
      position: absolute;
      top: -9px;
      left: var(--space-md);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background: linear-gradient(180deg, var(--color-gold) 0%, #d99a1f 100%);
      color: var(--color-wood-dark);
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      box-shadow: var(--shadow-soft);
    }

    .sh-hero-title {
      font-family: var(--font-display);
      font-size: var(--font-size-lg);
      font-weight: 800;
      color: var(--color-text);
      margin: 0 0 var(--space-sm);
    }

    .sh-hero-contents {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
    }

    .sh-hero-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .sh-hero-item-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sh-hero-item-icon svg {
      width: 100%;
      height: 100%;
    }

    .sh-hero-item-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--color-text-muted);
      text-align: center;
    }

    .sh-hero-plus {
      color: var(--color-text-muted);
      font-weight: 700;
      font-size: var(--font-size-md);
    }

    .sh-buy-btn {
      width: 100%;
      text-decoration: none;
    }

    .sh-hero-strike {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      text-decoration: line-through;
      margin-right: 6px;
    }

    /* ---------- Sections ---------- */
    .sh-section {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .sh-section-title {
      font-size: var(--font-size-xs);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-muted);
    }

    /* Remove Ads — single prominent row */
    .sh-removeads {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      border-radius: var(--radius-lg);
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      box-shadow: var(--shadow-soft);
    }

    .sh-removeads-icon {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sh-removeads-icon svg {
      width: 100%;
      height: 100%;
      stroke: var(--color-blue);
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sh-removeads-text {
      flex: 1 1 auto;
    }

    .sh-removeads-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: var(--font-size-md);
      color: var(--color-text);
    }

    .sh-removeads-sub {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }

    .sh-removeads .btn-primary {
      flex: 0 0 auto;
      padding: 10px 18px;
      font-size: var(--font-size-sm);
      text-decoration: none;
    }

    /* Coin packs grid */
    .sh-coin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-sm);
    }

    .coin-pack {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: var(--space-sm) 4px;
      border-radius: var(--radius-md);
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      box-shadow: var(--shadow-soft);
    }

    .coin-pack.is-best {
      border-color: var(--color-gold);
      box-shadow: 0 0 0 2px var(--color-gold), var(--shadow-soft);
    }

    .coin-pack-bonus {
      position: absolute;
      top: -6px;
      right: 2px;
      background: var(--color-green);
      color: #fff;
      font-size: 8px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: var(--radius-pill);
    }

    .coin-pack-icon {
      width: 26px;
      height: 26px;
    }

    .coin-pack-amount {
      font-size: 11px;
      font-weight: 800;
      color: var(--color-text);
    }

    .coin-pack-price {
      width: 100%;
      display: block;
      box-sizing: border-box;
      text-align: center;
      padding: 5px 0;
      border-radius: var(--radius-pill);
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      color: var(--color-text);
      font-size: 10px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.12s ease, background 0.12s ease;
    }

    .coin-pack-price:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.12);
    }

    #shopCoinBalance {
      display: inline-block;
    }

    .sh-coin-pill.is-ticking #shopCoinBalance {
      animation: coinTickUp 0.4s ease;
    }

    @keyframes coinTickUp {
      0%   { transform: scale(1);    color: var(--color-gold); }
      40%  { transform: scale(1.35); color: var(--color-gold); }
      100% { transform: scale(1);    color: var(--color-text); }
    }

    /* Boosters grid */
    .sh-booster-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-sm);
    }

    .booster-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: var(--space-sm) 4px;
      border-radius: var(--radius-md);
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      box-shadow: var(--shadow-soft);
    }

    .booster-item-icon {
      width: 24px;
      height: 24px;
      stroke: var(--color-gold);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .booster-item-name {
      font-size: 10px;
      font-weight: 700;
      color: var(--color-text);
    }

    .booster-item-price {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      color: var(--color-text);
    }

    .booster-item-price svg {
      width: 11px;
      height: 11px;
    }

    .sh-bundle {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-lg);
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      box-shadow: var(--shadow-soft);
    }

    .sh-bundle-icons {
      flex: 1 1 auto;
      display: flex;
      gap: 10px;
    }

    .sh-bundle-icons svg {
      width: 20px;
      height: 20px;
      stroke: var(--color-gold);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sh-bundle-text {
      flex: 1 1 auto;
      font-size: var(--font-size-sm);
      font-weight: 700;
      color: var(--color-text);
    }

    .sh-bundle .btn-secondary {
      flex: 0 0 auto;
      padding: 8px 16px;
      font-size: var(--font-size-sm);
    }

    /* Themes preview card */
    .sh-themes-card {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      border-radius: var(--radius-lg);
      background: var(--color-panel);
      border: 1px solid var(--color-panel-border);
      box-shadow: var(--shadow-soft);
      text-decoration: none;
      transition: transform 0.12s ease;
    }

    .sh-themes-card:active {
      transform: scale(0.98);
    }

    .sh-themes-swatches {
      flex: 0 0 auto;
      display: flex;
      gap: 4px;
    }

    .sh-themes-swatches span {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      display: block;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.25), inset 0 -1px 2px rgba(0, 0, 0, 0.3);
    }

    .sh-themes-text {
      flex: 1 1 auto;
      font-weight: 700;
      color: var(--color-text);
      font-size: var(--font-size-sm);
    }

    .sh-themes-arrow {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      stroke: var(--color-text-muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Reuse theme swatch palettes for the preview strip */
    .pal-marble { background: linear-gradient(160deg, #f2f2f2 0%, #c9c9cf 55%, #93949c 100%); }
    .pal-candy  { background: linear-gradient(160deg, #ffc4e0 0%, #ff5fa0 55%, #c72368 100%); }
    .pal-space  { background: linear-gradient(160deg, #6a4fc9 0%, #362279 55%, #150c33 100%); }
    .pal-neon   { background: linear-gradient(160deg, #ff6df0 0%, #a020ff 55%, #1de8ff 100%); }

  </style>
</head>
<body>
  <div class="device-stage">
    <div class="device-toggle">
      <button type="button" class="is-active" data-size="mobile">Mobile</button>
      <button type="button" data-size="tablet">Tablet</button>
    </div>
    <div class="device-frame" id="frame">
      <div class="device-frame__screen bg-wood-grain">

        <!-- Dimmed sliver of main-menu peeking above the sheet -->
        <div class="sheet-bg">
          <div class="menu-topbar-bg">
            <div class="pill-counter">
              <span class="pill-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M8 3h8v4a4 4 0 0 1-8 0V3z"/>
                  <path d="M12 9l1.2 2.4 2.6.4-1.9 1.8.4 2.5L12 15l-2.3 1.2.4-2.5-1.9-1.8 2.6-.4L12 9z"/>
                  <path d="M12 16v2"/>
                  <path d="M9 20h6"/>
                </svg>
              </span>
              <span>10,140</span>
            </div>
            <div class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10c.1.7.6 1.3 1.5 1.5H20a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </div>
          </div>
        </div>

        <div class="sheet-overlay">
          <div class="sheet-scrim"></div>
          <div class="bottom-sheet">
            <div class="sheet-handle-row">
              <span class="sheet-handle"></span>
            </div>

        <div class="sh-stage">

          <div class="sh-header">
            <h1 class="sh-title">Shop</h1>
            <div class="screen-header-right">
              <div class="pill-counter sh-coin-pill">
                <span class="pill-icon">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/><path d="M12 6.5v11M8.7 9.3c0-1.1 1.2-1.9 3.3-1.9s3.3.8 3.3 1.9c0 1-.9 1.5-3.3 1.9-2.4.4-3.3.9-3.3 2 0 1.1 1.3 1.9 3.3 1.9s3.3-.8 3.3-1.9" fill="none" stroke="var(--color-wood-dark)" stroke-width="1.3" stroke-linecap="round"/></svg>
                </span>
                <span id="shopCoinBalance">640</span>
              </div>
            </div>
          </div>

          <!-- Starter Pack — best value, stands out up top -->
          <div class="sh-hero">
            <span class="sh-ribbon">BEST VALUE</span>
            <h2 class="sh-hero-title">Starter Pack</h2>
            <div class="sh-hero-contents">
              <div class="sh-hero-item">
                <span class="sh-hero-item-icon">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/><path d="M12 6.5v11M8.7 9.3c0-1.1 1.2-1.9 3.3-1.9s3.3.8 3.3 1.9c0 1-.9 1.5-3.3 1.9-2.4.4-3.3.9-3.3 2 0 1.1 1.3 1.9 3.3 1.9s3.3-.8 3.3-1.9" fill="none" stroke="var(--color-wood-dark)" stroke-width="1.3" stroke-linecap="round"/></svg>
                </span>
                <span class="sh-hero-item-label">2,000</span>
              </div>
              <span class="sh-hero-plus">+</span>
              <div class="sh-hero-item">
                <span class="sh-hero-item-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-gold)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3.5l4.5 4.5-2.7 2.7-4.5-4.5z"/><path d="M12.3 6.2L4.8 13.7a2 2 0 0 0 0 2.8l1.7 1.7a2 2 0 0 0 2.8 0l7.5-7.5"/><path d="M5 19l3-3"/></svg>
                </span>
                <span class="sh-hero-item-label">5 Boosters</span>
              </div>
              <span class="sh-hero-plus">+</span>
              <div class="sh-hero-item">
                <span class="sh-hero-item-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-gold)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="9" rx="1.5"/><path d="M4 10a8 6 0 0 1 16 0"/><circle cx="12" cy="14.5" r="1.3" fill="var(--color-gold)" stroke="none"/></svg>
                </span>
                <span class="sh-hero-item-label">Theme</span>
              </div>
            </div>
            <a href="#" class="btn-primary sh-buy-btn"><span class="sh-hero-strike">$9.99</span> $4.99</a>
          </div>

          <!-- Remove Ads — prominent one-time purchase -->
          <div class="sh-removeads">
            <span class="sh-removeads-icon">
              <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M2 2l20 20"/><path d="M17.5 8.5a5 5 0 0 1 0 7"/></svg>
            </span>
            <span class="sh-removeads-text">
              <span class="sh-removeads-title">Remove Ads</span>
              <span class="sh-removeads-sub">No interruptions, ever</span>
            </span>
            <a href="#" class="btn-primary">$2.99</a>
          </div>

          <!-- Coins -->
          <div class="sh-section">
            <span class="sh-section-title">Coins</span>
            <div class="sh-coin-grid">
              <div class="coin-pack">
                <svg class="coin-pack-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-gold)"/></svg>
                <span class="coin-pack-amount">500</span>
                <a href="#" class="coin-pack-price" data-coins="500">$0.99</a>
              </div>
              <div class="coin-pack">
                <svg class="coin-pack-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--color-gold)"/></svg>
                <span class="coin-pack-amount">1,200</span>
                <a href="#" class="coin-pack-price" data-coins="1200">$1.99</a>
              </div>
              <div class="coin-pack is-best">
                <span class="coin-pack-bonus">+10%</span>
                <svg class="coin-pack-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="18" rx="8" ry="3" fill="#b9791a"/><ellipse cx="12" cy="14.5" rx="8" ry="3" fill="var(--color-gold)"/><ellipse cx="12" cy="11" rx="8" ry="3" fill="var(--color-gold)"/><ellipse cx="12" cy="7.5" rx="8" ry="3" fill="#ffe28a"/></svg>
                <span class="coin-pack-amount">2,600</span>
                <a href="#" class="coin-pack-price" data-coins="2600">$3.99</a>
              </div>
              <div class="coin-pack">
                <span class="coin-pack-bonus">+20%</span>
                <svg class="coin-pack-icon" viewBox="0 0 24 24"><ellipse cx="12" cy="18" rx="8" ry="3" fill="#b9791a"/><ellipse cx="12" cy="14.5" rx="8" ry="3" fill="var(--color-gold)"/><ellipse cx="12" cy="11" rx="8" ry="3" fill="var(--color-gold)"/><ellipse cx="12" cy="7.5" rx="8" ry="3" fill="#ffe28a"/></svg>
                <span class="coin-pack-amount">6,000</span>
                <a href="#" class="coin-pack-price" data-coins="6000">$7.99</a>
              </div>
            </div>
          </div>

          <!-- Boosters -->
          <div class="sh-section">
            <span class="sh-section-title">Boosters</span>
            <div class="sh-booster-grid">
              <div class="booster-item">
                <svg class="booster-item-icon" viewBox="0 0 24 24"><path d="M15 3.5l4.5 4.5-2.7 2.7-4.5-4.5z"/><path d="M12.3 6.2L4.8 13.7a2 2 0 0 0 0 2.8l1.7 1.7a2 2 0 0 0 2.8 0l7.5-7.5"/><path d="M5 19l3-3"/></svg>
                <span class="booster-item-name">Hammer</span>
                <span class="booster-item-price">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/></svg>
                  80
                </span>
              </div>
              <div class="booster-item">
                <svg class="booster-item-icon" viewBox="0 0 24 24"><circle cx="12" cy="14" r="6.5"/><path d="M12 7.5V5"/><path d="M12 5c1-1.3 2.3-1.3 2.8-2.6"/><circle cx="15.2" cy="1.7" r="1" fill="var(--color-gold)" stroke="none"/></svg>
                <span class="booster-item-name">Bomb</span>
                <span class="booster-item-price">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/></svg>
                  120
                </span>
              </div>
              <div class="booster-item">
                <svg class="booster-item-icon" viewBox="0 0 24 24"><path d="M3 12h5"/><path d="M8 9h4v6H8z"/><path d="M12 10h3.5v4H12z"/><path d="M15.5 11.5H19"/></svg>
                <span class="booster-item-name">Drill</span>
                <span class="booster-item-price">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/></svg>
                  100
                </span>
              </div>
              <div class="booster-item">
                <svg class="booster-item-icon" viewBox="0 0 24 24" fill="var(--color-gold)" stroke="none"><path d="M13 2L4.5 13.5H10L9 22l9-13H12z"/></svg>
                <span class="booster-item-name">Lightning</span>
                <span class="booster-item-price">
                  <svg viewBox="0 0 24 24" class="icon-coin"><circle cx="12" cy="12" r="10"/></svg>
                  150
                </span>
              </div>
            </div>

            <div class="sh-bundle">
              <div class="sh-bundle-icons">
                <svg viewBox="0 0 24 24"><path d="M15 3.5l4.5 4.5-2.7 2.7-4.5-4.5z"/><path d="M12.3 6.2L4.8 13.7a2 2 0 0 0 0 2.8l1.7 1.7a2 2 0 0 0 2.8 0l7.5-7.5"/></svg>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="6.5"/><path d="M12 7.5V5"/></svg>
                <svg viewBox="0 0 24 24"><path d="M3 12h5"/><path d="M8 9h4v6H8z"/></svg>
                <svg viewBox="0 0 24 24" fill="var(--color-gold)" stroke="none"><path d="M13 2L4.5 13.5H10L9 22l9-13H12z"/></svg>
              </div>
              <span class="sh-bundle-text">Booster Bundle x3 each</span>
              <a href="#" class="btn-secondary">$1.99</a>
            </div>
          </div>

          <!-- Themes -->
          <div class="sh-section">
            <span class="sh-section-title">Themes</span>
            <a href="themes.html" class="sh-themes-card">
              <span class="sh-themes-swatches">
                <span class="pal-marble"></span>
                <span class="pal-candy"></span>
                <span class="pal-space"></span>
                <span class="pal-neon"></span>
              </span>
              <span class="sh-themes-text">Browse all themes</span>
              <svg class="sh-themes-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </a>
          </div>

        </div>

            </div>
          </div>

      </div>
    </div>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var buttons = document.querySelectorAll('.device-toggle button');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.classList.remove('is-active'); });
        btn.classList.add('is-active');
        frame.classList.toggle('is-tablet', btn.dataset.size === 'tablet');
      });
    });

    // Coin pack purchase (mock) — bump the header balance with a tick-up pop.
    var coinBalanceEl = document.getElementById('shopCoinBalance');
    var coinPill = coinBalanceEl ? coinBalanceEl.closest('.sh-coin-pill') : null;
    var coinPackLinks = document.querySelectorAll('.coin-pack-price[data-coins]');
    coinPackLinks.forEach(function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        if (!coinBalanceEl || !coinPill) return;
        var current = parseInt(coinBalanceEl.textContent.replace(/,/g, ''), 10) || 0;
        var add = parseInt(link.dataset.coins, 10) || 0;
        var next = current + add;
        coinBalanceEl.textContent = next.toLocaleString('en-US');
        coinPill.classList.remove('is-ticking');
        // eslint-disable-next-line no-unused-expressions
        void coinPill.offsetWidth; // restart animation
        coinPill.classList.add('is-ticking');
      });
    });

    // Drag-to-dismiss — swipe the sheet down (or tap the dimmed scrim) to
    // close and return to the main menu, mocking the real gesture-based close.
    (function () {
      var sheet = document.querySelector('.bottom-sheet');
      var handle = document.querySelector('.sheet-handle-row');
      var scrim = document.querySelector('.sheet-scrim');
      if (!sheet || !handle) return;

      if (scrim) {
        scrim.addEventListener('click', function () {
          window.location.href = 'main-menu.html';
        });
      }

      var startY = 0;
      var dragY = 0;
      var dragging = false;

      handle.addEventListener('pointerdown', function (e) {
        dragging = true;
        startY = e.clientY;
        sheet.style.transition = 'none';
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        dragY = Math.max(0, e.clientY - startY);
        sheet.style.transform = 'translateY(' + dragY + 'px)';
      });

      function releaseDrag() {
        if (!dragging) return;
        dragging = false;
        sheet.style.transition = 'transform 0.25s ease';
        if (dragY > 120) {
          sheet.style.transform = 'translateY(100%)';
          setTimeout(function () {
            window.location.href = 'main-menu.html';
          }, 180);
        } else {
          sheet.style.transform = 'translateY(0)';
        }
        dragY = 0;
      }

      handle.addEventListener('pointerup', releaseDrag);
      handle.addEventListener('pointercancel', releaseDrag);
    })();
  </script>
</body>
